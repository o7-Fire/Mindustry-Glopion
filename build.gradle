static void downloadMindustry(URL url, File download) {
    downloadMindustry(url, download, null);
}

static void downloadMindustry(URL url, File download, String zipEntry) {
    download.getParentFile().mkdirs();
    if (download.exists()) return;

    if (zipEntry != null) {
        File zip = new File(download.getParentFile(), "package-" + download.getName() + ".zip");
        downloadMindustry(url, zip, null);
        java.util.zip.ZipFile archive = new java.util.zip.ZipFile(zip);
        try {
            java.util.zip.ZipEntry entry = archive.getEntry(zipEntry);
            if (entry == null) throw new org.gradle.api.GradleException("Missing " + zipEntry + " in " + zip);
            archive.getInputStream(entry).withStream { Files.copy(it, download.toPath(), StandardCopyOption.REPLACE_EXISTING) }
        } finally {
            archive.close()
        }
        return;
    }

    System.out.println("Downloading: " + url.toString());

    HttpURLConnection con = (HttpURLConnection) url.openConnection();
    BufferedInputStream input = new BufferedInputStream(con.getInputStream());
    download.getAbsoluteFile().getParentFile().mkdirs();
    RandomAccessFile output = new RandomAccessFile(download, "rw");

    int bytesRead;
    byte[] buffer = new byte[4096];
    long nextLog = System.currentTimeMillis() + 4000
    long readed = 0;
    while ((bytesRead = input.read(buffer)) != -1) {
        readed += bytesRead;
        output.write(buffer, 0, bytesRead);
        if (System.currentTimeMillis() > nextLog) {
            System.out.println(readed / 1_000_000)
            nextLog = System.currentTimeMillis() + 4000
        }
    }
    output.close()

}
//don't crash
static void copyToMindustry(File f) {
    File target = new File(getAppDataDirectoryString("Mindustry"))
    target = new File(target, "mods")
    target = new File(target, f.getName())
    target.getParentFile().mkdirs()
    System.out.println("Copying: " + f.getAbsolutePath() + " to " + target.getAbsolutePath());
    Files.copy(f.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING);
}

static boolean useStaticMindustryPackages() {
    return System.getProperty("modsNBE", null) == null;
}

static File staticMindustryCacheDir() {
    return new File(getAppDataDirectoryString("Mindustry"), "build/cache/o7-Fire/Static-Mindustry-Package/" + System.getProperty("mindustryHash")).absoluteFile;
}

static String staticDesktopId() {
    String os = System.getProperty('os.name').toLowerCase()
    if (os.contains('win')) return 'windows-x64'
    if (os.contains('mac')) return 'macos'
    return 'linux-x64'
}

static String staticDesktopAsset() {
    String os = System.getProperty('os.name').toLowerCase()
    if (os.contains('win')) return 'mindustry-windows-64-bit.zip'
    if (os.contains('mac')) return 'mindustry-macos.zip'
    return 'mindustry-linux-64-bit.zip'
}

static URL getMindustryServerURL() {
    if (!useStaticMindustryPackages()) {
        String h = System.getProperty("modsNBE");
        return new URL("https://github.com/Anuken/MindustryBuilds/releases/download/" + h + "/Mindustry-BE-Server-" + h + ".jar")
    }
    return new URL("https://github.com/o7-Fire/Static-Mindustry-Package/releases/download/" + System.getProperty("mindustryHash") + "/mindustry-server.zip");
}

static File getMindustryServerFile() {
    if (!useStaticMindustryPackages()) {
        URL u = getMindustryServerURL()
        File mindustry = new File(new File(new File(getAppDataDirectoryString("Mindustry")), "build/cache/"), u.getFile());
        return mindustry.getAbsoluteFile();
    }
    return new File(staticMindustryCacheDir(), "server.jar").absoluteFile;
}

static URL getMindustryURL() {
    if (!useStaticMindustryPackages()) {
        String h = System.getProperty("modsNBE");
        return new URL("https://github.com/Anuken/MindustryBuilds/releases/download/" + h + "/Mindustry-BE-Desktop-" + h + ".jar")
    }
    return new URL("https://github.com/o7-Fire/Static-Mindustry-Package/releases/download/" + System.getProperty("mindustryHash") + "/" + staticDesktopAsset());
}

static File getMindustryFile() {
    if (!useStaticMindustryPackages()) {
        URL u = getMindustryURL()
        File mindustry = new File(new File(new File(getAppDataDirectoryString("Mindustry")), "build/cache/"), u.getFile());
        return mindustry.getAbsoluteFile();
    }
    return new File(new File(staticMindustryCacheDir(), staticDesktopId()), "desktop.jar").absoluteFile;
}

