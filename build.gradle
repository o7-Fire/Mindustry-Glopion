public static void writeBootstrapperConfig(File root){
    String bootstrapConfigPath = "src/main/resources/glopion.bootstrapper.config.properties";
    File current = new File(".").getAbsoluteFile();
    File gradleProperties = new File(current, "gradle.properties");
    if(!gradleProperties.exists()) gradleProperties = new File(root, "gradle.properties");

    File bootstrapPropertiesFile = new File(current, bootstrapConfigPath);
    if(!bootstrapPropertiesFile.exists()) bootstrapPropertiesFile = new File(root, bootstrapConfigPath);
    Properties gradlePropertiesProperties = new Properties(), bootstrapperProperties = new Properties();

    try {
        gradlePropertiesProperties.load(new FileInputStream(gradleProperties));
        bootstrapperProperties.load(new FileInputStream(bootstrapPropertiesFile));
        String s = gradlePropertiesProperties.getProperty("mindustryHash");
        bootstrapperProperties.setProperty("MindustryVersion", s );
        bootstrapperProperties.setProperty("fooClient", gradlePropertiesProperties.getProperty("fooClient"))
        bootstrapperProperties.setProperty("minAndroidApi", gradlePropertiesProperties.getProperty("minAndroidApi"))
    } catch (Exception e) {
        e.printStackTrace();
    }

    //write
    try {
        bootstrapperProperties.store(new FileOutputStream(new File(root, bootstrapConfigPath)), "Dont edit this file, it is generated by the build script");
        bootstrapperProperties.store(new FileOutputStream(bootstrapPropertiesFile), null);
    } catch (Exception e) {
        e.printStackTrace();
    }
}