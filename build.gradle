static String getAppDataDirectoryString(String name) {
    String os = System.getProperty('os.name').toLowerCase()
    String home = System.getProperty('user.home')
    if (os.contains('win')) return new File(System.getenv('APPDATA') ?: home, name).absolutePath
    if (os.contains('mac')) return new File(home, 'Library/Application Support/' + name).absolutePath
    return new File(System.getenv('XDG_DATA_HOME') ?: home + '/.local/share', name).absolutePath
}

//github CI don't sort folder by default
static File getLatestFolder(File fe) {
    ArrayList<File> f = new ArrayList<>();
    if (!fe.exists()) throw new FileNotFoundException(fe.getAbsolutePath());
    File[] files = fe.listFiles();
    f.addAll(Arrays.asList(files));
    f.sort(new Comparator<File>() {
        @Override
        public int compare(File o1, File o2) {
            return o1.getAbsolutePath() <=> o2.getAbsolutePath();
        }
    });
    return f.get(f.size() - 1);
}

