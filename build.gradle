def localJarTasks = [":Atom:Atomic", ":Atom:Desktop"].findAll { findProject(it) != null }.collect { "${it}:jar" }
task base(type: Jar) {
    dependsOn(localJarTasks)
    dependsOn(aproj(":core").tasks.named("classes"), aproj(":desktop").tasks.named("classes"))
    dependsOn(":core:jar", ":desktop:jar")
    archiveFileName = modsNname + ".jar"//Mindustry-Glopion,jar
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)//stop including duplicated copy of library, D8 really mad
    from {
        (configurations.runtimeClasspath + aproj(":core").configurations.runtimeClasspath + aproj(":desktop").configurations.runtimeClasspath).findAll { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
//Runtime library only, compile library like arc won't get included
    }
    from files(aproj(":core").sourceSets.main.output)
    from files(aproj(":desktop").sourceSets.main.output)
    with jar//what is this
    manifest {
        attributes(
                'Main-Class': modsNJavaMain
        )
    }


    from(rootDir) {
        include "mod.hjson"//assuming the rootdir is actually current folder
        include "icon.png"
    }
}
// The bootstrapper looks for this exact artifact name when it wants the
// desktop-only deep-patching flavor. It is the full root jar (bootstrapper +
// core + desktop), unlike :desktop:base which lacks the bootstrapper itself.
task deepPatch(type: Jar) {
    dependsOn tasks.named('base')
    archiveFileName = modsNname + "-DeepPatch.jar"
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    manifest.attributes('Main-Class': modsNJavaMain)
    from {
        zipTree(tasks.named('base').flatMap { it.archiveFile })
    }
    exclude 'META-INF/MANIFEST.MF'
}
